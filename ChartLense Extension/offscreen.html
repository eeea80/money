<!DOCTYPE html>
<html>
  <head>
    <title>Offscreen Document for Image Processing</title>
  </head>
  <body>
    <canvas id="processing-canvas" style="display: none"></canvas>

    <script>
      // Handle messages from service worker
      chrome.runtime.onMessage.addListener((message, sender, sendResponse) => {
        if (message.action === "processBlackout") {
          processBlackout(message.dataUrl, message.blackoutAreas, message.privacyMode)
            .then((result) => sendResponse(result))
            .catch((error) => {
              console.error("Offscreen processing error:", error);
              sendResponse({ error: error.message });
            });
          return true;
        }
      });

      async function processBlackout(dataUrl, blackoutAreas, privacyMode) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => {
            try {
              const canvas = document.getElementById("processing-canvas");
              canvas.width = img.width;
              canvas.height = img.height;
              const ctx = canvas.getContext("2d");

              if (privacyMode === "allowlist") {
                // Allowlist: fill with black, draw original only in allowed areas
                ctx.fillStyle = "black";
                ctx.fillRect(0, 0, img.width, img.height);
                blackoutAreas.forEach((area) => {
                  ctx.drawImage(img,
                    area.x, area.y, area.width, area.height,
                    area.x, area.y, area.width, area.height);
                });
              } else {
                // Blackout: draw original, black out marked areas
                ctx.drawImage(img, 0, 0);
                blackoutAreas.forEach((area) => {
                  ctx.fillStyle = "black";
                  ctx.fillRect(area.x, area.y, area.width, area.height);
                });
              }

              const processedDataUrl = canvas.toDataURL("image/jpeg", 0.85);
              resolve({ processedDataUrl });
            } catch (error) {
              reject(error);
            }
          };
          img.onerror = () => reject(new Error("Failed to load image"));
          img.src = dataUrl;
        });
      }
    </script>
  </body>
</html>
