<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings — BO Signals AI</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <header class="row between center">
      <h1>Settings</h1>
      <a href="../popup/index.html" class="icon-btn" title="Open popup" aria-label="Open popup">↩</a>
    </header>

    <section class="card">
      <div class="row gap">
        <label class="field">
          <span class="label">Timeframe</span>
          <select id="tf">
            <option value="1m">1m</option>
            <option value="5m">5m</option>
            <option value="15m">15m</option>
            <option value="30m">30m</option>
            <option value="1h">1h</option>
          </select>
        </label>

        <label class="field">
          <span class="label">Time zone</span>
          <select id="timezone">
            <option value="auto">Auto (system)</option>
          </select>
        </label>

        <label class="field">
          <span class="label">Interval, min</span>
          <input type="number" id="interval" min="1" step="1" placeholder="5">
        </label>
      </div>

      <div class="row gap">
        <label class="field row center gap">
          <input type="checkbox" id="soundEnabled">
          <span>Notification sound</span>
        </label>

        <label class="field">
          <span class="label">Sound type</span>
          <select id="soundChoice">
            <option value="beep1">Beep 1</option>
            <option value="beep2">Beep 2</option>
            <option value="ding">Ding</option>
            <option value="bim">Bim</option>
          </select>
        </label>

        <button id="soundTest" class="btn secondary" type="button">Test</button>
      </div>

      <div class="row end">
        <button id="save" class="btn primary" type="button">Save</button>
      </div>
    </section>
  </main>

  <script src="options.js" type="module"></script>
</body>
</html>
